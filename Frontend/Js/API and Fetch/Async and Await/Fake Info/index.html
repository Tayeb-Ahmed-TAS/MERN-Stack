<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.1.2/css/all.css">
    <link rel="stylesheet" href="style.css">
    <title>Fake Info</title>
</head>

<body>

    <div class="container">
        <div class="card">
            <h2>Random User Info</h2>
            <div class="info">
                <p><strong>First Name:</strong> <span id="fname">Loading...</span> <strong>Last Name:</strong> <span
                        id="lname">Loading...</span></p>
                <p><strong>DOB:</strong> <span id="dob">Loading...</span> <strong>Gender:</strong> <span
                        id="gender">Loading...</span></p>
                <p><strong>Email:</strong> <span id="email">Loading...</span></p>
                <p><strong>Phone:</strong> <span id="phone">Loading...</span></p>
                <p><strong>City:</strong> <span id="city">Loading...</span> <strong>Zipcode:</strong> <span id="zipcode">Loading...</span></p>
                <p><strong>Country:</strong> <span id="country">Loading...</span></p>
            </div>
            <button id="fetchBtn"> <i class="fas fa-sync-alt"></i> Generate New</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
